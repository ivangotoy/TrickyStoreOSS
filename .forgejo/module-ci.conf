UPSTREAM_URL=https://github.com/beakthoven/TrickyStoreOSS.git
UPSTREAM_BRANCH=main
ZIP_PREFIX=Tricky-Store-OSS
VERSION_CODE_FLOOR=201
# versionCode = commit count; +2 keeps the fork at or above the build Ivan runs (201)
VERSION_CODE_OFFSET=2
CHANGELOG_PATH=changelog.md
# upstream .github/workflows/release.yml: JDK 26, submodules, assembleRelease -> out/*Release*.zip
build() {
    # the host suite first (scratch under the build user's HOME): a failing test stops the release
    mkdir -p "$HOME/tmp"
    TMPDIR="$HOME/tmp" sh tests/run.sh >&2
    git submodule update -q --init --recursive >&2
    export JAVA_HOME="$JAVA_HOME_26"
    chmod +x gradlew
    ./gradlew --no-daemon --parallel assembleRelease --stacktrace >&2
    mv "$(find out -name '*Release*.zip' | head -1)" "$OUT/module.zip"
}
